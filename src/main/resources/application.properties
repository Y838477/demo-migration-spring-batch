spring.application.name=demo-migration-spring-batch

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:~/projects/databases/demo_migration_batch_s3j17
spring.datasource.username=admin
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Allows initialisation of the schema using 'schema.sql' file
spring.sql.init.mode=always
# Allows initialisation of the Metadata tables used by Spring Batch
spring.batch.jdbc.initialize-schema=always

input.csv.file=classpath:authors.csv